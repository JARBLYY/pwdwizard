<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PWDWizard — Add Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: #2a2a3d;
      --accent: #4a9eff;
      --accent2: #4a9eff;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --error: #ff4d6d;
      --success: #4a9eff;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74, 158, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 158, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,15,0.8);
      backdrop-filter: blur(12px);
    }

   
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

   
    .logo-icon{
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    .logo span { color:  #4a9eff; }

    .btn-ghost {
      padding: 10px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

    main {
      position: relative;
      z-index: 1;
      max-width: 540px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .page-header {
      margin-bottom: 36px;
    }

    .page-header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }

    .page-header h1 span { color: var(--accent2); }

    .page-header p {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 32px;
      animation: fadeUp 0.4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .flash {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      margin-bottom: 20px;
    }
    .flash.error { background: rgba(255,77,109,0.12); border: 1px solid rgba(255,77,109,0.3); color: var(--error); }
    .flash.success { background: rgba(0,229,191,0.1); border: 1px solid rgba(0,229,191,0.3); color: var(--success); }

    .field { margin-bottom: 22px; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(42, 57, 196, 0.5);
    }

    /* mode toggle */
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 22px;
    }

    .mode-opt {
      position: relative;
    }

    .mode-opt input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-opt label {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: none;
      letter-spacing: 0;
      font-size: 13px;
      font-family: 'Syne', sans-serif;
      font-weight: 600;
      color: var(--muted);
      gap: 6px;
    }

    .mode-opt label .mode-icon { font-size: 22px; }
    .mode-opt label .mode-label { font-size: 13px; }
    .mode-opt label .mode-desc { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--muted); }

    .mode-opt input:checked + label {
      border-color: var(--accent);
      background: rgba(42, 57, 196, 0.5);
      color: var(--text);
      box-shadow: 0 0 0 1px var(--accent);
    }

    #manual-field { transition: opacity 0.2s; }
    #manual-field.hidden { display: none; }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #4a9eff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba();
      margin-top: 8px;
    }

    .btn-submit:hover { opacity: 0.9; box-shadow: 0 6px 28px rgba(42, 57, 196, 0.678); }
    .btn-submit:active { transform: scale(0.99); }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
      display: block;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/dashboard" class="logo">
    <img src="{{ url_for('static', filename='images/PWDWizard_logo.png') }}" alt="PWDWizard logo" class="logo-icon">
    </a>

    <a href="/dashboard" class="btn-ghost">← Back to Vault</a>
  </nav>

  <main>
    <div class="page-header">
      <h1>Add <span>Password</span></h1>
      <p>New credentials will be encrypted before storage</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="card">
      <form method="POST" id="add-form">

        <div class="field">
          <label for="website">Website / Service</label>
          <input type="text" id="website" name="website" placeholder="e.g. github.com" required />
        </div>

        <div class="field">
          <label for="username">Username / Email</label>
          <input type="text" id="username" name="username" placeholder="e.g. myemail@example.com" required />
        </div>

        <span class="section-label">Password Mode</span>
        <div class="mode-toggle">
          <div class="mode-opt">
            <input type="radio" name="mode" id="mode-manual" value="manual" checked onchange="toggleMode()"/>
            <label for="mode-manual">
              <span class="mode-label">Enter Manually</span>
              <span class="mode-desc">use your own</span>
            </label>
          </div>
          <div class="mode-opt">
            <input type="radio" name="mode" id="mode-generate" value="generate" onchange="toggleMode()"/>
            <label for="mode-generate">
              <span class="mode-label">Auto-Generate</span>
              <span class="mode-desc">strong 12-char pwd</span>
            </label>
          </div>
        </div>

        <div class="field" id="manual-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" />
        </div>

        <button type="submit" class="btn-submit">Save to Vault →</button>
      </form>
    </div>
  </main>

  <script>
    function toggleMode() {
      const isManual = document.getElementById('mode-manual').checked;
      const field = document.getElementById('manual-field');
      const pwInput = document.getElementById('password');
      if (isManual) {
        field.classList.remove('hidden');
        pwInput.required = true;
      } else {
        field.classList.add('hidden');
        pwInput.required = false;
      }
    }
  </script>
</body>
</html>
