<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PWDWizard — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --border: #2a2a3d;
      --accent: #4a9eff;;
      --accent2: #4a9eff;;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --error: #ff4d6d;
      --success: #4a9eff;;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(74, 158, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 158, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridShift 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }

    /* glowing orb */
    body::after {
      content: '';
      position: fixed;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(74, 158, 255, 0.04) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px #141ead1a, 0 20px 60px rgba(0,0,0,0.4);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }


    .logo-icon img {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      color: #4a9eff;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
      font-family: 'Space Mono', monospace;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 2px;
    }

    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13, 33, 207, 0.5);
    }

    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #4a9eff);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(13, 33, 207, 0.5);
    }

    .btn:hover { opacity: 0.92; box-shadow: 0 6px 28px rgba(13, 33, 207, 0.5); }
    .btn:active { transform: scale(0.98); }

    .flash {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      margin-bottom: 20px;
    }

    .flash.error { background: rgba(255,77,109,0.12); border: 1px solid rgba(255,77,109,0.3); color: var(--error); }
    .flash.success { background: rgba(0,229,191,0.1); border: 1px solid rgba(0,229,191,0.3); color: var(--success); }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>
<div class="card">
    <div class="logo">
      <div class="logo-icon">
        <img src="{{ url_for('static', filename='images/PWDWizard_logo.png') }}" alt="PWDWizard logo">
      </div>
    </div

    <h1>Welcome back.</h1>
    <p class="subtitle"> Enter master password to unlock vault</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <label for="master_password">Master Password</label>
      <input type="password" id="master_password" name="master_password" placeholder="••••••••••••" autofocus required />
      <button type="submit" class="btn">Unlock Vault →</button>
    </form>

    <div class="divider"></div>
    <p class="hint">Your key is safe with the Wizard.</p>
  </div>
</body>
</html>
