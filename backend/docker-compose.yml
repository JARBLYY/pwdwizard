version: "3.8"

services:
  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pwdwizard
    ports:
      - "3306:3306"

  backend:
    build: .
    depends_on:
      - db
    stdin_open: true
    tty: true
    volumes:
    - .:/app
